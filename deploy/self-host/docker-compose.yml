# SpaFlow — Supabase tự host, bản tối giản: Postgres + GoTrue (đăng nhập) + PostgREST (API) + nginx (cổng /auth/v1, /rest/v1)
# Dựa trên docker-compose chính thức của Supabase (github.com/supabase/supabase/tree/master/docker), bỏ các dịch vụ app không dùng
# (Studio, Realtime, Storage, Edge Functions, Analytics). Phiên bản image lấy theo bản chính thức tháng 9/2026.
#
#   cp .env.example .env && node scripts/gen-keys.mjs >> .env   # rồi sửa các giá trị còn lại
#   docker compose up -d
name: spaflow

services:
  db:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    ports:
      # Chỉ mở cho máy chủ (chạy script chuyển dữ liệu / backup). Không mở ra Internet.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_EXP: ${JWT_EXPIRY:-3600}
    volumes:
      # Đặt mật khẩu cho các role nội bộ (authenticator, supabase_auth_admin…) = POSTGRES_PASSWORD
      - ./volumes/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:Z
      - ./volumes/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:Z
      - db-data:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]

  auth:
    image: supabase/gotrue:v2.196.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 3
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_ISSUER: ${API_EXTERNAL_URL}
      # Email + mật khẩu (trang /sign-in, /signup)
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM:-true}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
      # Số điện thoại + mã SMS (đặt lịch không cần tài khoản)
      GOTRUE_EXTERNAL_PHONE_ENABLED: ${ENABLE_PHONE_SIGNUP:-true}
      GOTRUE_SMS_AUTOCONFIRM: "false"
      GOTRUE_SMS_OTP_EXP: 300
      GOTRUE_SMS_OTP_LENGTH: 6
      GOTRUE_SMS_MAX_FREQUENCY: 60s
      GOTRUE_SMS_TEMPLATE: "Ma xac minh SpaFlow cua ban la {{ .Code }}"
      # Cách 1 — Twilio:
      GOTRUE_SMS_PROVIDER: ${SMS_PROVIDER:-twilio}
      GOTRUE_SMS_TWILIO_ACCOUNT_SID: ${SMS_TWILIO_ACCOUNT_SID}
      GOTRUE_SMS_TWILIO_AUTH_TOKEN: ${SMS_TWILIO_AUTH_TOKEN}
      GOTRUE_SMS_TWILIO_MESSAGE_SERVICE_SID: ${SMS_TWILIO_MESSAGE_SERVICE_SID}
      # Cách 2 — nhà cung cấp Việt Nam (eSMS, SpeedSMS…) qua "Send SMS hook": một endpoint HTTP nhận {user, sms.otp}
      # rồi gọi API brandname. Bật bằng 3 biến dưới (xem README):
      GOTRUE_HOOK_SEND_SMS_ENABLED: ${SMS_HOOK_ENABLED:-false}
      GOTRUE_HOOK_SEND_SMS_URI: ${SMS_HOOK_URI}
      GOTRUE_HOOK_SEND_SMS_SECRETS: ${SMS_HOOK_SECRETS}
      # Thử nghiệm không tốn SMS: "84901234567:123456"
      GOTRUE_SMS_TEST_OTP: ${SMS_TEST_OTP}

  rest:
    image: postgrest/postgrest:v14.17
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_MAX_ROWS: 1000
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY:-3600}

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [auth, rest]
    ports:
      - "${GATEWAY_PORT:-8000}:80"
    environment:
      ALLOWED_ORIGIN: ${SITE_URL}
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro

volumes:
  db-data:
  db-config:
